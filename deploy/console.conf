# PocketPaaS 控制台（面板）域名路由
#
# 平台只会为「应用」自动生成 nginx 路由（见 route_service.sync_route），
# 控制台自身的域名需要这份手工配置：把面板域名反代到平台本体的 8000 端口。
#
# 部署方式：由 docker-compose.yml 以只读方式挂载进容器的 /etc/nginx/conf.d/。
# 换面板域名时改这里的 server_name 即可，然后：
#   docker compose restart pocketpaas
#
# 两层反代（宿主已有 nginx，如宝塔）：
#   浏览器 → 外层 nginx :80 → 本文件所在的内层 nginx :8080 → 平台 8000
#   所以这里 listen 的是「内层端口」，与 .env.prod 的 NGINX_LISTEN_PORT 保持一致，
#   对外端口由外层 nginx 承担（NGINX_PUBLIC_PORT）。
#
# 注意：server_name 不能与应用子域名重复（应用形如 {app名}.{BASE_DOMAIN}），
# 否则 nginx 会出现同名 server 块、其中一个静默失效。

server {
    listen 8080;
    server_name app.jinyuttsrz.top;

    # 大文件上传（源码 zip）放宽请求体上限
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级：实时日志流（/ws/...）依赖这两行
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}