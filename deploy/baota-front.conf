# PocketPaaS 外层（宝塔）反代配置
#
# 适用场景：宿主已装宝塔面板，其 nginx 占用了 80 端口。
#
# 架构：浏览器 → 宝塔 nginx :80 / :443 → 平台内层 nginx :8080 → 平台 8000 / 各应用端口
#   · 本文件负责第一跳，必须透传 Host，否则内层 nginx 无法按域名分发。
#   · TLS 在**本层终止**，平台内层与平台本体继续走 HTTP，
#     因此 backend/.env.prod 的 USE_HTTPS 保持 false。
#
# 三个 server 块的分工：
#   1) *.beta.jinyuttsrz.top :80   应用子域名（继续走 HTTP）
#   2) app.jinyuttsrz.top    :80   控制台，301 跳转到 HTTPS
#   3) app.jinyuttsrz.top    :443  控制台（TLS 终止在这里）
#
# 为什么应用子域名不跳 HTTPS：
#   当前证书只签发了单域名 app.jinyuttsrz.top（SAN 不含 *.beta）。
#   若把 *.beta 也 301 到 HTTPS，浏览器会因证书不匹配而报错。
#   后续若申请泛域名证书（*.beta.jinyuttsrz.top），再把应用块改成 443 即可。
#
# 证书文件放置（与宝塔习惯一致）：
#   /www/server/panel/vhost/cert/app.jinyuttsrz.top/fullchain.pem
#   /www/server/panel/vhost/cert/app.jinyuttsrz.top/privkey.pem
#   服务商给的 bundle.crt（或 bundle.pem）已含中间证书，直接改名为 fullchain.pem；
#   私钥 *.key 改名为 privkey.pem。.csr 不需要上传。
#
# 安装（在服务器上执行，用 root）：
#   cp deploy/baota-front.conf /www/server/panel/vhost/nginx/pocketpaas-front.conf
#   /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#
# 注意：不要在宝塔 UI 里再为 app.jinyuttsrz.top 建一个带同名 server_name 的站点，
#       否则会产生同名 server 块，其中一个静默失效。

# ---------- 1) 应用子域名：保持 HTTP ----------
server {
    listen 80;
    # 应用泛域名；控制台域名不在此块内，避免被错误地跳到 HTTPS
    server_name *.beta.jinyuttsrz.top;

    # 源码 zip 上传放宽请求体上限
    client_max_body_size 100m;

    location / {
        # 指向平台内层 nginx（.env.prod 里的 NGINX_LISTEN_PORT）
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 关键：透传真实 Host，内层 nginx 靠它区分各个应用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级：应用日志流等场景依赖这两行
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------- 2) 控制台 HTTP：跳转到 HTTPS ----------
server {
    listen 80;
    server_name app.jinyuttsrz.top;

    # 续签/重新申请证书时的 HTTP-01 校验路径，避免被 301 吃掉
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/app.jinyuttsrz.top;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 3) 控制台 HTTPS：TLS 终止在这里 ----------
server {
    listen 443 ssl;
    server_name app.jinyuttsrz.top;

    ssl_certificate     /www/server/panel/vhost/cert/app.jinyuttsrz.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/app.jinyuttsrz.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTPS 验收通过后再启用 HSTS；启用后浏览器会强制走 HTTPS，回退成本较高
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 源码 zip 上传放宽请求体上限
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级：实时日志与容器终端依赖这两行
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
