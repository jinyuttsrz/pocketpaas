# PocketPaaS 外层（宝塔）反代配置
#
# 适用场景：宿主已装宝塔面板，其 nginx 占用了 80 端口，
# 平台内层 nginx 无法绑定 80（报 bind() to 0.0.0.0:80 failed）。
#
# 架构：浏览器 → 宝塔 nginx :80 → 平台内层 nginx :8080 → 平台 8000 / 各应用端口
#   · 本文件负责第一跳：把应用泛域名 *.beta.jinyuttsrz.top 与控制台
#     域名 app.jinyuttsrz.top 都转给内层 nginx。
#   · 必须透传 Host（$host），否则内层 nginx 无法按域名分发到具体应用。
#
# 安装（在服务器上执行，用 root）：
#   cat > /www/server/panel/vhost/nginx/pocketpaas-front.conf <<'CONF'
#   ...（本文件 server{...} 部分）...
#   CONF
#   /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#
#  或：宝塔面板 → 网站 → 添加站点（域名同时填 *.beta.jinyuttsrz.top 和 app.jinyuttsrz.top，纯静态），
#     再编辑该站点配置文件，用下面的 location 覆盖默认内容。
#
# 注意：不要在这里再写 listen 443 / ssl 相关内容，等 HTTPS 阶段再加。

server {
    listen 80;
    # 一个 server 块列出两个名字，内层 nginx 再按 Host 分发：
    #   *.beta.jinyuttsrz.top → 各应用；app.jinyuttsrz.top → 控制台
    server_name *.beta.jinyuttsrz.top app.jinyuttsrz.top;

    # 源码 zip 上传放宽请求体上限
    client_max_body_size 100m;

    location / {
        # 指向平台内层 nginx（.env.prod 里的 NGINX_LISTEN_PORT）
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 关键：透传真实 Host，内层 nginx 靠它区分控制台 / 各个应用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级：控制台的实时日志流（/ws/...）依赖这两行
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}